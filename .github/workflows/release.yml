name: release

# 打 tag（v*）时自动构建 APK 并附加到对应 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 tag（例如 v2.00）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_TOOLS_VERSION: '36.1.0'
      ANDROID_SDK_ROOT: 'C:\Android\android-sdk'
      ANDROID_HOME: 'C:\Android\android-sdk'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它的 --licenses 步骤在 windows runner 上
      # 缺少 --sdk_root 会直接退出 1（历史三次失败都卡在这一步）。
      - name: Install Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'cmdline-tools.zip'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip' -OutFile $zip
          $tmp = Join-Path $env:RUNNER_TEMP 'ct'
          Expand-Archive $zip -DestinationPath $tmp -Force
          $dest = Join-Path $sdk 'cmdline-tools\latest'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $tmp 'cmdline-tools\*') $dest -Recurse -Force

          $sdkm = Join-Path $dest 'bin\sdkmanager.bat'
          if (-not (Test-Path $sdkm)) { throw "sdkmanager not found at $sdkm" }
          Write-Host "sdkmanager: $sdkm"

          $yes = (1..30 | ForEach-Object { 'y' }) -join "`n"
          $yes | & $sdkm "--sdk_root=$sdk" --licenses
          & $sdkm "--sdk_root=$sdk" 'platforms;android-35' "build-tools;$env:BUILD_TOOLS_VERSION" 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager install failed ($LASTEXITCODE)" }

          Write-Host "--- installed build-tools ---"
          Get-ChildItem (Join-Path $sdk 'build-tools') | ForEach-Object { $_.Name }

      - name: Build APK
        shell: powershell
        run: |
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed ($LASTEXITCODE)" }

      - name: Locate artifact
        id: artifact
        shell: pwsh
        run: |
          $apk = Get-ChildItem out/*.apk | Select-Object -First 1
          if (-not $apk) { throw "no apk produced" }
          "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($apk.Name)"     >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash"          >> $env:GITHUB_OUTPUT
          Write-Host "APK=$($apk.Name) sha256=$hash"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
